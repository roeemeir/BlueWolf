apiVersion: apps/v1
kind: Deployment
metadata:
  name: bluewolf-runtime
  labels:
    app.kubernetes.io/name: bluewolf-runtime
    app.kubernetes.io/part-of: bluewolf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bluewolf-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bluewolf-runtime
        app.kubernetes.io/part-of: bluewolf
    spec:
      containers:
        - name: runtime
          # Replace this image with the image produced from deploy/runtime/Dockerfile.
          image: bluewolf-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BLUEWOLF_RUNTIME_HOST
              value: "0.0.0.0"
            - name: BLUEWOLF_RUNTIME_PORT
              value: "8080"
            - name: BLUEWOLF_RUNTIME_STALE_SECONDS
              value: "15"
            - name: BLUEWOLF_RUNTIME_EXPIRE_SECONDS
              value: "60"
            - name: BLUEWOLF_CORE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bluewolf-runtime-secrets
                  key: core-api-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: bluewolf-runtime
  labels:
    app.kubernetes.io/name: bluewolf-runtime
    app.kubernetes.io/part-of: bluewolf
spec:
  selector:
    app.kubernetes.io/name: bluewolf-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
