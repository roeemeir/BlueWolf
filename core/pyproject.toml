[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-wolf"
version = "0.1.0"
description = "Blue Wolf vehicle-route and synchronization analysis core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Blue Wolf" }]
dependencies = [
  "numpy>=2,<3",
  "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
]
influx = [
  "influxdb-client>=1.50,<2",
]
service = [
  "uvicorn>=0.35,<1",
]
operational = [
  "influxdb-client>=1.50,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
bluewolf-runtime = "bluewolf_runtime_adapter.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bluewolf_core"]
