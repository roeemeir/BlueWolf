name: Blue Wolf OP-02 Map Layers

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-op02-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  map-layers:
    name: OP-02 — truth-backed map layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Run Web map contract regressions
        run: node --test tests/op02-map-layers.test.mjs tests/live-runtime-route-evidence.test.mjs
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Verify confirmed route reaches runtime WGS84 evidence
        working-directory: core/tests
        run: python -m unittest -v test_runtime_map_evidence
      - name: Type-check map surfaces
        run: npx tsc --noEmit
