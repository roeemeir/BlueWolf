name: Blue Wolf Temporary Share

on:
  push:
    branches:
      - local-preview-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production runtime
        run: npm run build

      - name: Prepare local D1
        working-directory: dist/server
        run: |
          node ../../node_modules/wrangler/bin/wrangler.js d1 execute site-creator-d1 \
            --local \
            --config wrangler.json \
            --file ../.openai/drizzle/0000_luxuriant_tarantula.sql

      - name: Start Blue Wolf locally
        working-directory: dist/server
        run: |
          nohup node ../../node_modules/wrangler/bin/wrangler.js dev --config wrangler.json --port 3000 \
            >/tmp/bluewolf-wrangler.log 2>&1 &
          echo $! >/tmp/bluewolf-wrangler.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -120 /tmp/bluewolf-wrangler.log
          exit 1

      - name: Start cookie password gate
        shell: bash
        run: |
          SHARE_PASSWORD="$(openssl rand -hex 10)"
          SHARE_TOKEN="$(openssl rand -hex 24)"
          printf '%s' "$SHARE_PASSWORD" >/tmp/share-password
          printf '%s' "$SHARE_TOKEN" >/tmp/share-token

          cat >/tmp/auth-proxy.mjs <<'EOF'
          import http from 'node:http';
          import { URLSearchParams } from 'node:url';

          const password = process.env.SHARE_PASSWORD;
          const token = process.env.SHARE_TOKEN;
          const cookieName = 'bw_preview';

          function hasAuth(req) {
            const cookie = req.headers.cookie ?? '';
            return cookie.split(';').some((part) => part.trim() === `${cookieName}=${token}`);
          }

          function loginPage(message = '') {
            const safeMessage = message ? '<p style="color:#f87171;margin:0 0 16px">סיסמה שגויה</p>' : '';
            return `<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Wolf Preview</title><style>body{margin:0;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(88vw,380px);background:#0f1c2e;border:1px solid #29415f;border-radius:22px;padding:28px;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#a9bfd8;margin:0 0 22px}input{box-sizing:border-box;width:100%;font:inherit;background:#081525;color:#fff;border:1px solid #385778;border-radius:12px;padding:13px 14px;margin-bottom:12px}button{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:#3b82f6;color:white}</style></head><body><form class="card" method="post" action="/__bluewolf_login"><h1>זאב כחול</h1><p>סביבת בדיקה זמנית</p>${safeMessage}<input name="password" type="password" autocomplete="current-password" placeholder="סיסמה" autofocus><button type="submit">כניסה</button></form></body></html>`;
          }

          function proxy(req, res) {
            const headers = { ...req.headers };
            delete headers.connection;
            delete headers.authorization;
            headers.host = req.headers.host ?? '127.0.0.1:3000';
            headers['x-forwarded-host'] = req.headers.host ?? '';
            headers['x-forwarded-proto'] = 'https';
            headers['x-forwarded-port'] = '443';

            const upstream = http.request({
              hostname: '127.0.0.1',
              port: 3000,
              path: req.url,
              method: req.method,
              headers,
            }, (upstreamRes) => {
              const responseHeaders = { ...upstreamRes.headers };
              delete responseHeaders.connection;
              res.writeHead(upstreamRes.statusCode ?? 502, responseHeaders);
              upstreamRes.pipe(res);
            });

            upstream.on('error', (error) => {
              if (!res.headersSent) res.writeHead(502, { 'content-type': 'text/plain; charset=utf-8' });
              res.end(`Proxy error: ${error.message}`);
            });
            req.pipe(upstream);
          }

          const server = http.createServer(async (req, res) => {
            if (req.url?.startsWith('/__bluewolf_login')) {
              if (req.method === 'POST') {
                const chunks = [];
                for await (const chunk of req) chunks.push(chunk);
                const form = new URLSearchParams(Buffer.concat(chunks).toString('utf8'));
                if (form.get('password') === password) {
                  res.writeHead(303, {
                    location: '/',
                    'set-cookie': `${cookieName}=${token}; Path=/; HttpOnly; Secure; SameSite=Lax`,
                    'cache-control': 'no-store',
                  });
                  res.end();
                  return;
                }
                res.writeHead(401, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' });
                res.end(loginPage('bad-password'));
                return;
              }
              res.writeHead(200, { 'content-type': 'text/html; charset=utf-8', 'cache-control': 'no-store' });
              res.end(loginPage());
              return;
            }

            if (!hasAuth(req)) {
              res.writeHead(303, { location: '/__bluewolf_login', 'cache-control': 'no-store' });
              res.end();
              return;
            }

            proxy(req, res);
          });

          server.listen(3001, '127.0.0.1');
          EOF

          nohup env SHARE_PASSWORD="$SHARE_PASSWORD" SHARE_TOKEN="$SHARE_TOKEN" \
            node /tmp/auth-proxy.mjs >/tmp/auth-proxy.log 2>&1 &
          echo $! >/tmp/auth-proxy.pid
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = "303"
          curl -sS -c /tmp/local-cookies.txt -d "password=$SHARE_PASSWORD" \
            -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/__bluewolf_login | grep -q '^303$'
          test "$(curl -s -b /tmp/local-cookies.txt -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = "200"

      - name: Start temporary tunnel and verify assets
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3001 \
            >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid

          URL=""
          for i in $(seq 1 45); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo 'Tunnel URL was not created.'
            tail -120 /tmp/cloudflared.log
            exit 1
          fi

          PASSWORD="$(cat /tmp/share-password)"
          rm -f /tmp/tunnel-cookies.txt
          for i in $(seq 1 20); do
            LOGIN_CODE="$(curl -sS -c /tmp/tunnel-cookies.txt -d "password=$PASSWORD" \
              -o /dev/null -w '%{http_code}' --max-time 15 "$URL/__bluewolf_login" || true)"
            if [ "$LOGIN_CODE" = "303" ]; then break; fi
            sleep 3
          done
          test "$LOGIN_CODE" = "303"

          curl -fsS -b /tmp/tunnel-cookies.txt --max-time 20 "$URL/" -o /tmp/tunnel-page.html
          grep -q 'זאב כחול' /tmp/tunnel-page.html

          ASSET_PATH="$(grep -Eo '(src|href)="[^"]+\.(css|js)[^"]*"' /tmp/tunnel-page.html | head -1 | sed -E 's/^(src|href)="([^"]+)"$/\2/' || true)"
          if [ -z "$ASSET_PATH" ]; then
            echo 'Could not find a CSS/JS asset in rendered HTML.'
            head -c 3000 /tmp/tunnel-page.html
            exit 1
          fi
          case "$ASSET_PATH" in
            http://*|https://*) ASSET_URL="$ASSET_PATH" ;;
            /*) ASSET_URL="$URL$ASSET_PATH" ;;
            *) ASSET_URL="$URL/$ASSET_PATH" ;;
          esac
          ASSET_CODE="$(curl -sS -b /tmp/tunnel-cookies.txt -o /tmp/tunnel-asset.bin -w '%{http_code}' --max-time 20 "$ASSET_URL")"
          test "$ASSET_CODE" = "200"
          test -s /tmp/tunnel-asset.bin

          {
            echo "URL=$URL"
            echo "PASSWORD=$PASSWORD"
            echo "LOGIN_PATH=/__bluewolf_login"
            echo "ASSET_CHECK=passed:$ASSET_PATH"
            echo "EXPIRES_APPROXIMATELY=90 minutes after this workflow starts"
          } >/tmp/bluewolf-share-credentials.txt

      - name: Upload private share credentials
        uses: actions/upload-artifact@v4
        with:
          name: bluewolf-share-credentials
          path: /tmp/bluewolf-share-credentials.txt
          retention-days: 1
          compression-level: 0

      - name: Keep preview alive
        run: |
          echo 'Blue Wolf temporary share is active.'
          sleep 5400
