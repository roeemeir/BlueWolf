name: Blue Wolf QA Quick Tunnel

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - components/**
      - lib/**
      - core/**
      - package.json
      - package-lock.json
      - .github/workflows/qa-quick-tunnel.yml

concurrency:
  group: bluewolf-qa-quick-tunnel
  cancel-in-progress: true

jobs:
  preview:
    name: SQLite offline QA preview
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BLUEWOLF_STORAGE: sqlite
      BLUEWOLF_SQLITE_PATH: ${{ github.workspace }}/data/qa-preview.sqlite
      BLUEWOLF_HOST: 0.0.0.0
      PORT: "3000"
      BLUEWOLF_CORE_API_URL: http://127.0.0.1:8090
      BLUEWOLF_RUNTIME_HOST: 127.0.0.1
      BLUEWOLF_RUNTIME_PORT: "8090"
      BLUEWOLF_CONFIG_VERSION: qa-preview
      BLUEWOLF_CODE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -e './core[service]'
      - name: Start Python Core QA service
        run: |
          nohup bluewolf-runtime > /tmp/bluewolf-core.log 2>&1 &
          echo $! > /tmp/bluewolf-core.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8090/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/bluewolf-core.log
            exit 1
          fi
      - name: Build verified offline application
        run: npm run build:offline
      - name: Start SQLite offline server
        run: |
          mkdir -p data
          nohup npm run start:offline > /tmp/bluewolf-server.log 2>&1 &
          echo $! > /tmp/bluewolf-server.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/bluewolf-server.log
            exit 1
          fi
      - name: Install cloudflared
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
      - name: Open QA Quick Tunnel
        id: tunnel
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          url=""
          for attempt in $(seq 1 45); do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$url" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$url" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "$url" > /tmp/bluewolf-qa-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Blue Wolf QA Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage: local SQLite only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python Core QA: http://127.0.0.1:8090 (provenance + QA endpoints)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime secrets: none" >> "$GITHUB_STEP_SUMMARY"
          echo "BLUEWOLF_QA_URL=$url"
      - name: Publish QA URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluewolf-qa-url
          path: /tmp/bluewolf-qa-url.txt
          if-no-files-found: error
          retention-days: 1
      - name: Keep preview alive
        run: |
          server_pid=$(cat /tmp/bluewolf-server.pid)
          tunnel_pid=$(cat /tmp/cloudflared.pid)
          while kill -0 "$server_pid" 2>/dev/null && kill -0 "$tunnel_pid" 2>/dev/null; do
            sleep 30
          done
          echo "Preview process exited unexpectedly"
          echo "--- server ---"
          cat /tmp/bluewolf-server.log || true
          echo "--- cloudflared ---"
          cat /tmp/cloudflared.log || true
          exit 1
