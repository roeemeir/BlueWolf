name: Blue Wolf E2E Integration — Public Preview Disabled

# This workflow previously published a public QA URL after HTTP 200 while the
# Python service was in transport-only mode. That is forbidden by the governing
# Master annex QA-E2E-20260923. This job is PRIVATE and cannot publish a URL.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - components/**
      - lib/**
      - core/**
      - scripts/verify-e2e-preflight.mjs
      - docs/E2E_QA_RELEASE_GATE_HE.md
      - package.json
      - package-lock.json
      - .github/workflows/qa-quick-tunnel.yml

concurrency:
  group: bluewolf-qa-quick-tunnel
  cancel-in-progress: true

jobs:
  integration:
    name: Private Web + SQLite + operational Python Core + Influx preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BLUEWOLF_STORAGE: sqlite
      BLUEWOLF_SQLITE_PATH: ${{ github.workspace }}/data/qa-e2e.sqlite
      BLUEWOLF_OPERATIONAL_CONFIG: ${{ github.workspace }}/data/qa-e2e-operational.json
      BLUEWOLF_CORE_API_URL: http://127.0.0.1:8090
      BLUEWOLF_E2E_WEB_URL: http://127.0.0.1:3000
      BLUEWOLF_RUNTIME_HOST: 127.0.0.1
      BLUEWOLF_RUNTIME_PORT: "8090"
      BLUEWOLF_HOST: 127.0.0.1
      PORT: "3000"
      BLUEWOLF_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BLUEWOLF_INFLUX_TOKEN: ${{ secrets.BLUEWOLF_E2E_INFLUX_TOKEN }}
      BLUEWOLF_E2E_OPERATIONAL_CONFIG_JSON: ${{ secrets.BLUEWOLF_E2E_OPERATIONAL_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail closed without a real operational Influx configuration
        run: |
          if [ -z "${BLUEWOLF_INFLUX_TOKEN:-}" ] || [ -z "${BLUEWOLF_E2E_OPERATIONAL_CONFIG_JSON:-}" ]; then
            echo 'BLOCKED: a complete E2E operational configuration and Influx token are required. No public QA URL will be created.'
            exit 1
          fi
          mkdir -p data
          umask 077
          printf '%s\n' "$BLUEWOLF_E2E_OPERATIONAL_CONFIG_JSON" > "$BLUEWOLF_OPERATIONAL_CONFIG"
          # Never log config contents, Influx tokens, or data-source credentials.
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const cfg=JSON.parse(readFileSync(process.env.BLUEWOLF_OPERATIONAL_CONFIG,"utf8")); if(!Array.isArray(cfg.servers)||cfg.servers.length<3) throw new Error("all three operational servers must be configured"); if(!cfg.influx?.url || cfg.influx.url.includes("influxdb2.internal")) throw new Error("real Influx endpoint is required");'
      - name: Install application and Core dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -e './core[service]'
      - name: Start actual operational Python Core (not transport-only)
        run: |
          nohup bluewolf-runtime > /tmp/bluewolf-core-e2e.log 2>&1 &
          echo $! > /tmp/bluewolf-core-e2e.pid
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8090/readyz > /tmp/bluewolf-core-ready.json 2>/dev/null && \
              node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("/tmp/bluewolf-core-ready.json","utf8")); if(p.ok!==true || p.mode!=="operational" || p.running!==true || p.tickCount<2 || !Array.isArray(p.serverErrors) || p.serverErrors.length) process.exit(1);'; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/bluewolf-core-e2e.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo 'BLOCKED: operational Core has not produced two error-free polling ticks.'
            # Logs can contain backend details. They are deliberately not dumped here.
            exit 1
          fi
      - name: Build verified offline Web application
        run: npm run build:offline
      - name: Start SQLite-backed Web server
        run: |
          nohup npm run start:offline > /tmp/bluewolf-web-e2e.log 2>&1 &
          echo $! > /tmp/bluewolf-web-e2e.pid
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3000/api/workspace > /dev/null 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/bluewolf-web-e2e.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo 'BLOCKED: SQLite Web API did not become available.'
            exit 1
          fi
      - name: Check operational Core feed, three servers and SQLite write/read
        run: node scripts/verify-e2e-preflight.mjs
      - name: End-to-end acceptance remains blocked pending event, report, restart and browser checks
        run: |
          echo 'Private integration preflight completed. This does NOT authorize a public QA URL.'
          echo 'BLOCKED: event-start recompute, archive and PDF, persistence/restart, browser/iPhone E2E, original-document audit and BW-GOV-010 evidence still require full verification.'
          echo 'No tunnel, preview artifact or public link is created by this workflow.'
