name: Blue Wolf CI

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Python core — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - route-vector
          - session
          - integrated-session
          - semantic-session
          - so-phase
          - so-template-bank
          - so-template-fit
          - so-template-selection
          - so-templates
          - double-lobe-phase
          - so-scoring
          - live-so-scoring
          - event-alert
          - live-so-event-runtime
          - influxdb2-adapter
          - ingest-coordinator
          - live-polling
          - operational-pipeline
          - runtime-service
          - runtime-producer
          - live-runtime-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e '.[service,influx]'
      - name: Run deterministic core shard
        working-directory: core/tests
        run: python -m unittest -v test_${{ matrix.shard == 'route-vector' && 'route_vector' || matrix.shard == 'integrated-session' && 'integrated_session' || matrix.shard == 'semantic-session' && 'semantic_session' || matrix.shard == 'so-phase' && 'so_phase' || matrix.shard == 'so-template-bank' && 'so_template_bank' || matrix.shard == 'so-template-fit' && 'so_template_fit' || matrix.shard == 'so-template-selection' && 'so_template_selection' || matrix.shard == 'so-templates' && 'so_templates' || matrix.shard == 'double-lobe-phase' && 'double_lobe_phase' || matrix.shard == 'so-scoring' && 'so_scoring' || matrix.shard == 'live-so-scoring' && 'live_so_scoring' || matrix.shard == 'event-alert' && 'event_alert' || matrix.shard == 'live-so-event-runtime' && 'live_so_event_runtime' || matrix.shard == 'influxdb2-adapter' && 'influxdb2_adapter' || matrix.shard == 'ingest-coordinator' && 'ingest_coordinator' || matrix.shard == 'live-polling' && 'live_polling' || matrix.shard == 'operational-pipeline' && 'operational_pipeline' || matrix.shard == 'runtime-service' && 'runtime_service' || matrix.shard == 'runtime-producer' && 'runtime_producer' || matrix.shard == 'live-runtime-contract' && 'live_runtime_contract' || 'session' }}

  lifecycle-smoke:
    name: Lifecycle smoke — ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - stable-route
          - initial-confirmation-geometry
          - fast-period-acquisition
          - free-approach-attribution
          - geometry-replacement
          - period-replacement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run focused lifecycle regression
        working-directory: core/tests
        run: |
          case "${{ matrix.case }}" in
            stable-route) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_stable_route_does_not_emit_replacement ;;
            initial-confirmation-geometry) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_initial_confirmation_uses_confirmed_window_geometry_not_approach_history ;;
            fast-period-acquisition) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_fast_period_route_acquires_before_legacy_five_minute_wait ;;
            free-approach-attribution) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_free_closed_approach_is_attributed_to_confirmed_route_history ;;
            geometry-replacement) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_geometry_change_emits_replacement_after_evidence ;;
            period-replacement) python -m unittest -v test_route_change.AdaptiveRouteChangeTests.test_period_only_change_emits_replacement_after_evidence ;;
          esac

  packaging:
    name: Runtime deployment packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenShift YAML
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('deploy/openshift/runtime.yaml')
          documents = list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
          assert len(documents) == 2
          assert [item['kind'] for item in documents] == ['Deployment', 'Service']
          deployment = documents[0]
          assert deployment['spec']['replicas'] == 1
          assert deployment['spec']['strategy']['type'] == 'Recreate'
          pod = deployment['spec']['template']['spec']
          container = pod['containers'][0]
          env = {item['name']: item for item in container['env']}
          assert env['BLUEWOLF_OPERATIONAL_CONFIG']['value'] == '/etc/bluewolf/runtime.json'
          assert env['BLUEWOLF_OPERATIONAL_STATE_PATH']['value'] == '/var/lib/bluewolf/runtime-state.json'
          assert env['BLUEWOLF_CORE_API_TOKEN']['valueFrom']['secretKeyRef']['key'] == 'core-api-token'
          assert env['BLUEWOLF_INFLUX_TOKEN']['valueFrom']['secretKeyRef']['key'] == 'influx-token'
          mounts = {item['name']: item['mountPath'] for item in container['volumeMounts']}
          assert mounts['operational-config'] == '/etc/bluewolf'
          assert mounts['operational-state'] == '/var/lib/bluewolf'
          volumes = {item['name']: item for item in pod['volumes']}
          assert volumes['operational-config']['configMap']['name'] == 'bluewolf-runtime-config'
          assert volumes['operational-state']['persistentVolumeClaim']['claimName'] == 'bluewolf-runtime-state'
          assert container['securityContext']['runAsNonRoot'] is True
          PY
      - name: Validate Windows PowerShell syntax
        shell: pwsh
        run: |
          $paths = @('deploy/windows/install-runtime.ps1', 'deploy/windows/run-runtime.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Build runtime image
        run: docker build --build-arg BLUEWOLF_CODE_SHA=${GITHUB_SHA} -f deploy/runtime/Dockerfile -t bluewolf-runtime:ci .
      - name: Validate image provenance and non-root runtime
        run: |
          test "$(docker image inspect bluewolf-runtime:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect bluewolf-runtime:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^BLUEWOLF_CODE_SHA=' | cut -d= -f2-)" = "${GITHUB_SHA}"
          test "$(docker image inspect bluewolf-runtime:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect bluewolf-runtime:ci --format '{{index .Config.Labels "io.bluewolf.provenance.code-sha"}}')" = "${GITHUB_SHA}"
      - name: Smoke runtime-owned provenance and real Core QA endpoint
        run: |
          docker run -d --name bluewolf-runtime-ci \
            -e BLUEWOLF_CORE_API_TOKEN=ci-token \
            -e BLUEWOLF_CONFIG_VERSION=ci-runtime-package \
            -p 18080:8080 \
            bluewolf-runtime:ci
          cleanup() { docker rm -f bluewolf-runtime-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs bluewolf-runtime-ci
            exit 1
          fi
          curl --fail --silent --show-error \
            -H 'Authorization: Bearer ci-token' \
            http://127.0.0.1:18080/v1/provenance > /tmp/bluewolf-provenance.json
          curl --fail --silent --show-error --max-time 120 \
            -X POST \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"scenarioId":"ci-runtime-smoke","configVersion":"spoofed-client-value","scope":"smoke"}' \
            http://127.0.0.1:18080/v1/qa/run > /tmp/bluewolf-qa.json
          python - <<'PY'
          import json, os
          provenance = json.load(open('/tmp/bluewolf-provenance.json', encoding='utf-8'))
          payload = json.load(open('/tmp/bluewolf-qa.json', encoding='utf-8'))
          assert provenance['schemaVersion'] == 'bluewolf.runtime-provenance.v1'
          assert provenance['codeSha'] == os.environ['GITHUB_SHA']
          assert provenance['configVersion'] == 'ci-runtime-package'
          assert payload['schemaVersion'] == 'bluewolf.qa-run.v1'
          assert payload['scenarioId'] == 'ci-runtime-smoke'
          assert payload['codeSha'] == provenance['codeSha']
          assert payload['configVersion'] == provenance['configVersion']
          assert payload['configVersion'] != 'spoofed-client-value'
          assert payload['scope'] == 'smoke'
          assert payload['categories']
          assert {item['id'] for item in payload['categories']} == {'scoring', 'determinism'}
          assert all(item['passed'] + item['failed'] == item['scenarios'] for item in payload['categories'])
          PY

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  offline-web:
    name: Offline web and SQLite restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BLUEWOLF_STORAGE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - run: node scripts/verify-offline-http.mjs
