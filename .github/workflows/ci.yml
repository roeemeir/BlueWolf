name: Blue Wolf CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Python core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic core tests
        working-directory: core
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Tests and preview asset smoke
        run: npm test

  browser:
    name: Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [core, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Start production server
        run: |
          PORT=3000 npm start > /tmp/bluewolf-server.log 2>&1 &
          echo $! > /tmp/bluewolf-server.pid
          for attempt in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bluewolf-server.log
          exit 1
      - name: Desktop and mobile browser smoke
        env:
          BLUEWOLF_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/browser-v08.spec.mjs --reporter=line --workers=1
      - name: Production server log
        if: always()
        run: tail -n 250 /tmp/bluewolf-server.log || true
