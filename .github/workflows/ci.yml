name: Blue Wolf CI

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-smoke:
    name: Lifecycle smoke — ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: fast-period-acquisition
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_confirmation_latency_scales_with_route_period
          - case: free-approach-attribution
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_free_approach_is_excluded_by_shortest_sufficient_suffix
          - case: initial-confirmation-geometry
            test: test_session.SessionDeterminismTests.test_route_candidate_then_confirmation_and_phase_are_adaptive
          - case: stable-route
            test: test_route_change.AdaptiveRouteChangeTests.test_stable_confirmed_route_does_not_emit_replacement
          - case: geometry-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_session_replaces_confirmed_route_without_fixed_change_timer
          - case: period-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_period_only_change_is_detected_and_attributed_retroactively
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run focused lifecycle regression
        working-directory: core/tests
        run: python -m unittest -v "${{ matrix.test }}"

  core:
    name: Python core — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: route-change-remainder
            tests: >-
              test_route_change.AdaptiveRouteChangeTests.test_material_geometry_and_period_change_is_detected
              test_route_change.AdaptiveRouteChangeTests.test_small_refit_drift_does_not_create_route_change
              test_route_change.AdaptiveRouteChangeTests.test_change_onset_is_retroactive_to_new_geometry
              test_route_change.AdaptiveRouteChangeTests.test_route_replacement_survives_checkpoint_mid_change
          - shard: session
            tests: test_session
          - shard: integrated-session
            tests: test_integrated_session
          - shard: classifiers
            tests: test_route_classifier_sweep test_route_classifier_v2 test_vector_route_detection
          - shard: route-vector
            tests: test_route_detection test_vector_trajectory test_vector_sample_adapter test_partial_route_candidate
          - shard: fundamentals
            tests: test_geometry test_grouping test_group_lifecycle test_ingest_join test_scoring test_simulator test_templates test_trajectory_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run deterministic core shard
        working-directory: core/tests
        run: python -m unittest -v ${{ matrix.tests }}

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
