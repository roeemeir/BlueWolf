name: Blue Wolf CI

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-smoke:
    name: Lifecycle smoke — ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: fast-period-acquisition
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_confirmation_latency_scales_with_route_period
          - case: free-approach-attribution
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_free_approach_is_excluded_by_shortest_sufficient_suffix
          - case: initial-confirmation-geometry
            test: test_session.SessionDeterminismTests.test_route_candidate_then_confirmation_and_phase_are_adaptive
          - case: stable-route
            test: test_route_change.AdaptiveRouteChangeTests.test_stable_confirmed_route_does_not_emit_replacement
          - case: geometry-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_session_replaces_confirmed_route_without_fixed_change_timer
          - case: period-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_period_only_change_is_detected_and_attributed_retroactively
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run focused lifecycle regression
        working-directory: core/tests
        run: python -m unittest -v "${{ matrix.test }}"

  core:
    name: Python core — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: route-change-remainder
            tests: >-
              test_route_change.AdaptiveRouteChangeTests.test_material_geometry_and_period_change_is_detected
              test_route_change.AdaptiveRouteChangeTests.test_small_refit_drift_does_not_create_route_change
              test_route_change.AdaptiveRouteChangeTests.test_change_onset_is_retroactive_to_new_geometry
              test_route_change.AdaptiveRouteChangeTests.test_route_replacement_survives_checkpoint_mid_change
          - shard: session
            tests: test_session
          - shard: integrated-session
            tests: test_integrated_session
          - shard: semantic-session
            tests: test_semantic_session
          - shard: classifiers
            tests: test_route_classifier_sweep test_route_classifier_v2 test_vector_route_detection
          - shard: route-vector
            tests: test_route_detection test_vector_trajectory test_vector_sample_adapter test_partial_route_candidate
          - shard: fundamentals
            tests: test_geometry test_grouping test_group_lifecycle test_si_direction_lifecycle test_ingest_join test_scoring test_simulator test_templates test_trajectory_simulator
          - shard: so-templates
            tests: test_so_templates
          - shard: so-template-fit
            tests: test_so_template_fit
          - shard: so-phase
            tests: test_so_phase
          - shard: double-lobe-phase
            tests: test_double_lobe_phase
          - shard: so-scoring
            tests: test_so_scoring
          - shard: so-template-bank
            tests: test_so_template_bank
          - shard: so-template-selection
            tests: test_so_template_selection
          - shard: live-so-scoring
            tests: test_live_so_scoring
          - shard: event-alert
            tests: test_event_alert
          - shard: live-so-event-runtime
            tests: test_live_so_event_runtime
          - shard: live-runtime-contract
            tests: test_live_runtime_contract
          - shard: runtime-service
            tests: test_runtime_service
          - shard: influxdb2-adapter
            tests: test_influxdb2_adapter test_influx_window_reader
          - shard: live-polling
            tests: test_live_polling
          - shard: ingest-coordinator
            tests: test_ingest_coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run deterministic core shard
        working-directory: core/tests
        run: python -m unittest -v ${{ matrix.tests }}

  runtime-packaging:
    name: Runtime deployment packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenShift YAML
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('deploy/openshift/runtime.yaml')
          documents = list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
          assert len(documents) == 2
          assert [item['kind'] for item in documents] == ['Deployment', 'Service']
          deployment = documents[0]
          assert deployment['spec']['replicas'] == 1
          assert deployment['spec']['strategy']['type'] == 'Recreate'
          PY
      - name: Validate Windows PowerShell syntax
        shell: pwsh
        run: |
          $paths = @('deploy/windows/install-runtime.ps1', 'deploy/windows/run-runtime.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Build runtime image
        run: docker build -f deploy/runtime/Dockerfile -t bluewolf-runtime:ci .
      - name: Smoke runtime image
        run: |
          docker run -d --name bluewolf-runtime-ci -e BLUEWOLF_CORE_API_TOKEN=ci-token -p 18080:8080 bluewolf-runtime:ci
          cleanup() { docker rm -f bluewolf-runtime-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs bluewolf-runtime-ci
          exit 1

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
