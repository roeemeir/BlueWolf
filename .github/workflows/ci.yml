name: Blue Wolf CI

on:
  push:
    paths-ignore:
      - "packages/bluewolf-core/**"
  pull_request:
    paths-ignore:
      - "packages/bluewolf-core/**"
  workflow_dispatch:

jobs:
  algorithm-core:
    name: Algorithm Core contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run isolated replaceable-core suite
        run: npm run core:test

  python-reference:
    name: Python reference core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run retained deterministic reference tests
        working-directory: core
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    name: Web application + persistence contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: JS regression + architecture + DB contract tests
        run: npm test

  browser:
    name: Browser QA v1.5 Core + NAV truth
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [algorithm-core, python-reference, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run build
      - name: Start application runtime
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/bluewolf-server.log 2>&1 &
          echo $! > /tmp/bluewolf-server.pid
          for attempt in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            if ! kill -0 $(cat /tmp/bluewolf-server.pid) 2>/dev/null; then cat /tmp/bluewolf-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/bluewolf-server.log
          exit 1
      - name: v1.5 provenance, Core boundary, history, GT and mobile acceptance
        env:
          BLUEWOLF_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/browser-v12.spec.mjs --reporter=line --workers=1
      - name: Application runtime log
        if: always()
        run: tail -n 250 /tmp/bluewolf-server.log || true
