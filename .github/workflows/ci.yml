name: Blue Wolf CI

on:
  push:
    paths-ignore:
      - "core/**"
      - "packages/bluewolf-core/**"
  pull_request:
    paths-ignore:
      - "core/**"
      - "packages/bluewolf-core/**"
  workflow_dispatch:

jobs:
  python-core:
    name: Canonical Python Algorithm Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run canonical Core suite
        working-directory: core
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Show contract defaults
        working-directory: core
        run: |
          PYTHONPATH=src python - <<'PY'
          import bluewolf_core
          from bluewolf_core import CoreConfig
          c = CoreConfig()
          print("Core API", bluewolf_core.CORE_API_VERSION)
          print("implementation", bluewolf_core.IMPLEMENTATION_LANGUAGE)
          print("grid/batch/checkpoint", c.timing.logical_grid_seconds, c.timing.live_batch_seconds, c.timing.checkpoint_seconds)
          print("membership confirmation", c.grouping.membership_confirmation_seconds)
          PY

  web:
    name: Web application + persistence + migration compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Temporary TypeScript Core compatibility suite
        run: npm run core:test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: JS regression + architecture + DB contract tests
        run: npm test

  browser:
    name: Browser QA v1.8 NAV truth + Python Core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [python-core, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run build
      - name: Start canonical Python Core service
        run: |
          PYTHONPATH=core/src python core/service/http_service.py --host 127.0.0.1 --port 8765 > /tmp/bluewolf-python-core.log 2>&1 &
          echo $! > /tmp/bluewolf-python-core.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            if ! kill -0 $(cat /tmp/bluewolf-python-core.pid) 2>/dev/null; then cat /tmp/bluewolf-python-core.log; exit 1; fi
            sleep 1
          done
          cat /tmp/bluewolf-python-core.log
          exit 1
      - name: Start application runtime
        env:
          BLUEWOLF_PYTHON_CORE_URL: http://127.0.0.1:8765
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/bluewolf-server.log 2>&1 &
          echo $! > /tmp/bluewolf-server.pid
          for attempt in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            if ! kill -0 $(cat /tmp/bluewolf-server.pid) 2>/dev/null; then cat /tmp/bluewolf-server.log; exit 1; fi
            sleep 1
          done
          cat /tmp/bluewolf-server.log
          exit 1
      - name: Verify Web proxy reaches Python Core
        run: |
          curl -fsS http://127.0.0.1:3000/api/core/rpc | grep -q '"implementationLanguage":"python"'
      - name: Provenance, history, GT and mobile acceptance
        env:
          BLUEWOLF_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/browser-v12.spec.mjs --reporter=line --workers=1
      - name: Runtime logs
        if: always()
        run: |
          echo "--- Focused Core diagnostics ---"
          grep -E '\[bluewolf-live-core\]|\[bluewolf-core-rpc-error\]' /tmp/bluewolf-server.log || true
          echo "--- Python Core ---"
          tail -n 150 /tmp/bluewolf-python-core.log || true
          echo "--- Web ---"
          tail -n 250 /tmp/bluewolf-server.log || true
