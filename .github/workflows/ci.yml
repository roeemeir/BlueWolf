name: Blue Wolf CI

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lifecycle-smoke:
    name: Lifecycle smoke — ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: fast-period-acquisition
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_confirmation_latency_scales_with_route_period
          - case: free-approach-attribution
            test: test_adaptive_acquisition.AdaptiveAcquisitionSimulationTests.test_free_approach_is_excluded_by_shortest_sufficient_suffix
          - case: initial-confirmation-geometry
            test: test_session.SessionDeterminismTests.test_route_candidate_then_confirmation_and_phase_are_adaptive
          - case: stable-route
            test: test_route_change.AdaptiveRouteChangeTests.test_stable_confirmed_route_does_not_emit_replacement
          - case: geometry-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_session_replaces_confirmed_route_without_fixed_change_timer
          - case: period-replacement
            test: test_route_change.AdaptiveRouteChangeTests.test_period_only_change_is_detected_and_attributed_retroactively
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run focused lifecycle regression
        working-directory: core/tests
        run: python -m unittest -v "${{ matrix.test }}"

  core:
    name: Python core — ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: route-change-remainder
            tests: >-
              test_route_change.AdaptiveRouteChangeTests.test_material_geometry_and_period_change_is_detected
              test_route_change.AdaptiveRouteChangeTests.test_small_refit_drift_does_not_create_route_change
              test_route_change.AdaptiveRouteChangeTests.test_change_onset_is_retroactive_to_new_geometry
              test_route_change.AdaptiveRouteChangeTests.test_route_replacement_survives_checkpoint_mid_change
          - shard: session
            tests: test_session
          - shard: integrated-session
            tests: test_integrated_session
          - shard: semantic-session
            tests: test_semantic_session
          - shard: fundamentals
            tests: test_geometry test_scoring test_grouping
          - shard: classifiers
            tests: test_classifiers
          - shard: route-vector
            tests: test_route_vector test_grouping
          - shard: event-alert
            tests: test_event_alert
          - shard: live-so-scoring
            tests: test_live_so_scoring
          - shard: so-scoring
            tests: test_so_scoring
          - shard: so-template-fit
            tests: test_so_template_fit
          - shard: so-template-selection
            tests: test_so_template_selection
          - shard: so-template-bank
            tests: test_so_template_bank
          - shard: so-templates
            tests: test_so_templates
          - shard: so-phase
            tests: test_so_phase
          - shard: live-so-event-runtime
            tests: test_live_so_event_runtime test_event_recompute test_event_observation_sink
          - shard: live-runtime-contract
            tests: test_live_runtime_contract
          - shard: runtime-producer
            tests: test_runtime_producer
          - shard: operational-pipeline
            tests: test_operational_pipeline
          - shard: ingest-coordinator
            tests: test_ingest_coordinator
          - shard: live-polling
            tests: test_live_polling
          - shard: runtime-service
            tests: >-
              test_runtime_service
              test_runtime_history
              test_runtime_history_footprint
              test_qa_service
              test_investigation_service
              test_event_archive_binding
          - shard: influxdb2-adapter
            tests: test_influxdb2_adapter
          - shard: double-lobe-phase
            tests: test_double_lobe_phase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Run deterministic core shard
        working-directory: core/tests
        run: python -m unittest -v ${{ matrix.tests }}

  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  offline-web:
    name: Offline web and SQLite restart
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BLUEWOLF_STORAGE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - run: node scripts/verify-offline-http.mjs

  runtime-packaging:
    name: Runtime deployment packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenShift YAML
        run: python - <<'PY'
          import pathlib
          import yaml
          for path in pathlib.Path('deploy/openshift').glob('*.yaml'):
              docs = list(yaml.safe_load_all(path.read_text()))
              assert docs and all(doc for doc in docs), path
          PY
      - name: Validate Windows PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/start-offline.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Build runtime image
        run: docker build --build-arg BLUEWOLF_CODE_SHA=${GITHUB_SHA} -f deploy/runtime/Dockerfile -t bluewolf-runtime:ci .
      - name: Validate non-root runtime image
        run: test "$(docker image inspect bluewolf-runtime:ci --format '{{.Config.User}}')" = "10001"
      - name: Smoke runtime image and real Core QA endpoint
        env:
          BLUEWOLF_API_TOKEN: ci-token
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          printf '%s\n' '{"version":1,"api":{"host":"0.0.0.0","port":8080,"auth_token_env":"BLUEWOLF_API_TOKEN"},"archive":{"path":"/data/archive.sqlite"},"checkpoint":{"path":"/data/checkpoint.json","code_version":"'"${GITHUB_SHA}"'"},"defaults":{"vehicle_types":{"default":{"work_speed_kmh":45.0}}},"servers":[{"server_id":0,"influx":{"url":"http://127.0.0.1:18086","org":"ci","bucket":"ci","token_env":"BLUEWOLF_INFLUX_TOKEN","source":{"measurement":"nav","server_field":"server_id","time_field":"_time","vehicle_field":"vehicle_id","field_columns":{"vehicle_number":"vehicle_number","active":"active","latitude_deg":"latitude","longitude_deg":"longitude","altitude_m":"altitude","velocity_north_mps":"vn","velocity_east_mps":"ve"}}}}]}' > "${tmpdir}/config.json"
          docker run -d --rm --name bluewolf-runtime-ci -p 18080:8080 \
            -e BLUEWOLF_API_TOKEN="${BLUEWOLF_API_TOKEN}" \
            -e BLUEWOLF_INFLUX_TOKEN=unused \
            -v "${tmpdir}/config.json:/config/runtime.json:ro" \
            bluewolf-runtime:ci --config /config/runtime.json
          trap 'docker logs bluewolf-runtime-ci || true; docker stop bluewolf-runtime-ci >/dev/null 2>&1 || true; rm -rf "${tmpdir}"' EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --fail --header "Authorization: Bearer ${BLUEWOLF_API_TOKEN}" http://127.0.0.1:18080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/health.json'))
          assert payload['status'] == 'ok', payload
          PY
          curl --silent --fail --header "Authorization: Bearer ${BLUEWOLF_API_TOKEN}" --header 'Content-Type: application/json' --data '{"scenarioId":"ci-runtime-smoke","scope":"smoke"}' http://127.0.0.1:18080/v1/qa/run >/tmp/qa.json
          python - <<'PY'
          import json, os
          payload = json.load(open('/tmp/qa.json'))
          assert payload['schemaVersion'] == 'bluewolf.qa-run.v1', payload
          assert payload['scenarioId'] == 'ci-runtime-smoke', payload
          assert payload['status'] == 'complete', payload
          assert payload['codeVersion'] == os.environ['GITHUB_SHA'], payload
          assert [category['id'] for category in payload['categories']] == ['scoring', 'determinism'], payload
          assert all(category['status'] == 'pass' for category in payload['categories']), payload
          PY
