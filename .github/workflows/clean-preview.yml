name: Blue Wolf v1.5 protected preview

on:
  workflow_dispatch:
  push:
    branches: [bluewolf-v07-clean]

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Replaceable Algorithm Core gate
        run: npm run core:test
      - name: Python reference-core gate
        working-directory: core
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Web + persistence release gates
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build
          npm test
      - name: Install Chromium browser QA runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start application runtime
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/bluewolf-app.log 2>&1 &
          echo $! > /tmp/bluewolf-app.pid
          for attempt in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            if ! kill -0 $(cat /tmp/bluewolf-app.pid) 2>/dev/null; then cat /tmp/bluewolf-app.log; exit 1; fi
            sleep 1
          done
          cat /tmp/bluewolf-app.log
          exit 1
      - name: v1.5 Core boundary, NAV truth, history, GT and mobile browser QA
        env:
          BLUEWOLF_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test tests/browser-v12.spec.mjs --reporter=line --workers=1
      - name: Create protected preview credentials
        run: |
          echo "PREVIEW_PASSWORD=$(openssl rand -hex 4)" >> "$GITHUB_ENV"
          echo "PREVIEW_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start cookie-protected preview gate
        env:
          PREVIEW_GATE_HOST: 127.0.0.1
          PREVIEW_GATE_PORT: 4173
          PREVIEW_UPSTREAM_HOST: 127.0.0.1
          PREVIEW_UPSTREAM_PORT: 3000
        run: |
          node scripts/preview-gate.mjs > /tmp/bluewolf-gate.log 2>&1 &
          echo $! > /tmp/bluewolf-gate.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ | grep -q "Protected validation preview"; then exit 0; fi
            sleep 1
          done
          cat /tmp/bluewolf-gate.log
          exit 1
      - name: Start Cloudflare Quick Tunnel
        run: |
          curl -L --fail --retry 4 --retry-delay 2 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          for attempt in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"; exit 0; fi
            if ! kill -0 $(cat /tmp/cloudflared.pid) 2>/dev/null; then cat /tmp/cloudflared.log; exit 1; fi
            sleep 1
          done
          cat /tmp/cloudflared.log
          exit 1
      - name: Verify public login, authenticated app, workspace API and assets
        run: |
          HOST=${PREVIEW_URL#https://}
          PUBLIC_READY=0
          for attempt in $(seq 1 60); do
            if getent ahostsv4 "$HOST" >/dev/null 2>&1 && curl -fsS --connect-timeout 5 --max-time 15 "$PREVIEW_URL/" -o /tmp/public-login.html; then PUBLIC_READY=1; break; fi
            sleep 2
          done
          if [ "$PUBLIC_READY" -ne 1 ]; then
            echo "Public tunnel never became DNS/reachability ready: $PREVIEW_URL"
            getent ahostsv4 "$HOST" || true
            tail -n 120 /tmp/cloudflared.log || true
            exit 1
          fi
          grep -q "Protected validation preview" /tmp/public-login.html
          LOGIN_CODE=$(curl --retry 10 --retry-all-errors --retry-delay 2 -sS -c /tmp/bluewolf-preview.cookies -o /dev/null -w '%{http_code}' -X POST --data-urlencode "password=$PREVIEW_PASSWORD" "$PREVIEW_URL/__bluewolf_login")
          test "$LOGIN_CODE" = "303"
          HOME_CODE=$(curl --retry 10 --retry-all-errors --retry-delay 2 -sS -b /tmp/bluewolf-preview.cookies -o /tmp/bluewolf-home.html -w '%{http_code}' "$PREVIEW_URL/")
          test "$HOME_CODE" = "200"
          grep -q "זאב כחול" /tmp/bluewolf-home.html
          if grep -q "Protected validation preview" /tmp/bluewolf-home.html; then exit 1; fi
          API_CODE=$(curl --retry 10 --retry-all-errors --retry-delay 2 -sS -b /tmp/bluewolf-preview.cookies -H "x-bluewolf-workspace: bw-preview-verification" -o /tmp/bluewolf-workspace.json -w '%{http_code}' "$PREVIEW_URL/api/workspace")
          test "$API_CODE" = "200"
          grep -Eq '"available":(true|false)' /tmp/bluewolf-workspace.json
          node - <<'NODE' > /tmp/bluewolf-assets.txt
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/bluewolf-home.html', 'utf8');
          const matches = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map((m) => m[1]);
          const assets = [...new Set(matches.filter((value) => value.startsWith('/') && !value.startsWith('//') && value !== '/'))];
          for (const asset of assets.slice(0, 30)) console.log(asset);
          NODE
          ASSET_COUNT=0
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            curl --retry 5 --retry-all-errors --retry-delay 1 -fsS -b /tmp/bluewolf-preview.cookies "$PREVIEW_URL$asset" -o /dev/null
            ASSET_COUNT=$((ASSET_COUNT + 1))
          done < /tmp/bluewolf-assets.txt
          echo "Verified public assets: $ASSET_COUNT"
      - name: Prepare verified preview details
        run: |
          {
            echo "PREVIEW_URL=$PREVIEW_URL"
            echo "PREVIEW_PASSWORD=$PREVIEW_PASSWORD"
            echo "COMMIT=$GITHUB_SHA"
            echo "VERIFICATION=Algorithm Core contract/tests + Python reference + lint + TypeScript + build + DB/architecture regression + v1.5 NAV/Influx/history/GT/browser/mobile + public login/workspace API/assets: PASS"
          } > /tmp/bluewolf-preview.txt
          cat /tmp/bluewolf-preview.txt
      - name: Upload preview details
        uses: actions/upload-artifact@v4
        with:
          name: bluewolf-verified-preview-v15
          path: /tmp/bluewolf-preview.txt
          retention-days: 1
          if-no-files-found: error
      - name: Keep verified preview alive
        run: |
          echo "Preview verified and available while this job remains active."
          sleep 4500
      - name: Diagnostics
        if: always()
        run: |
          echo "--- application ---"
          tail -n 220 /tmp/bluewolf-app.log 2>/dev/null || true
          echo "--- gate ---"
          tail -n 160 /tmp/bluewolf-gate.log 2>/dev/null || true
          echo "--- tunnel ---"
          tail -n 160 /tmp/cloudflared.log 2>/dev/null || true
