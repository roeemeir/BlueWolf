name: Blue Wolf v0.7 Apple Maps Preview

on:
  push:
    branches: [local-preview-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.5 base and v0.7 overlay
        shell: bash
        run: |
          cat .preview/v05.part* | base64 -d > /tmp/v05.tar.gz
          echo "7c6cea729ae5a4159e7386e19da4efd00555f12b08999017e5743e76f36ab567  /tmp/v05.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v05.tar.gz -C .
          base64 -d .preview/v07-overlay.b64 > /tmp/v07.tar.gz
          echo "2bbc5cbf2418ddab56dd4880bd1a37bd67d0abfdec2c47ec4f88ecbdcde84877  /tmp/v07.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v07.tar.gz -C .
          grep -q 'v0.7 · Apple Liquid Glass' components/bluewolf/developer-view.tsx
          grep -q 'hippodromePath' components/bluewolf/visuals.tsx
          grep -q 'showScoreTrace' components/bluewolf/visuals.tsx
          grep -q '1,000 תרחישים סימולטיביים' components/bluewolf/developer-view.tsx
          grep -q 'v07.css' app/layout.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate v0.7
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Prepare local D1
        working-directory: dist/server
        run: node ../../node_modules/wrangler/bin/wrangler.js d1 execute site-creator-d1 --local --config wrangler.json --file ../.openai/drizzle/0000_luxuriant_tarantula.sql

      - name: Start application
        working-directory: dist/server
        shell: bash
        run: |
          nohup node ../../node_modules/wrangler/bin/wrangler.js dev --config wrangler.json --port 3000 >/tmp/bluewolf.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          tail -120 /tmp/bluewolf.log
          exit 1

      - name: Start private preview gate
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 10)"
          TOKEN="$(openssl rand -hex 24)"
          printf '%s' "$PASSWORD" >/tmp/password
          cat >/tmp/proxy.mjs <<'EOF'
          import http from 'node:http';
          import {URLSearchParams} from 'node:url';
          const password=process.env.PASSWORD, token=process.env.TOKEN, cookieName='bw_preview';
          const authed=req=>(req.headers.cookie??'').split(';').some(x=>x.trim()===`${cookieName}=${token}`);
          const login=bad=>`<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blue Wolf v0.7</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 70% 15%,#17455a,#06101d 58%);color:#fff;font-family:system-ui,-apple-system}.card{box-sizing:border-box;width:min(86vw,360px);padding:26px;border-radius:30px;background:#173044a8;border:1px solid #ffffff32;backdrop-filter:blur(32px) saturate(180%);box-shadow:0 28px 80px #0008,inset 0 1px #ffffff4d}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:11px;border-radius:15px;font:inherit}input{color:#fff;background:#071625b8;border:1px solid #ffffff30}button{border:0;background:#4dd7cb;color:#062022;font-weight:850}.bad{color:#fb7185}</style></head><body><form class="card" method="post" action="/__bluewolf_login"><h1>זאב כחול</h1><p>v0.7 · Apple Liquid Glass</p>${bad?'<p class="bad">סיסמה שגויה</p>':''}<input name="password" type="password" placeholder="סיסמה" autofocus><button>כניסה</button></form></body></html>`;
          function proxy(req,res){const h={...req.headers,host:'127.0.0.1:3000','x-forwarded-proto':'https'};delete h.connection;delete h.authorization;const u=http.request({hostname:'127.0.0.1',port:3000,path:req.url,method:req.method,headers:h},r=>{const rh={...r.headers};delete rh.connection;res.writeHead(r.statusCode??502,rh);r.pipe(res)});u.on('error',e=>{res.writeHead(502);res.end(e.message)});req.pipe(u)}
          http.createServer(async(req,res)=>{if(req.url?.startsWith('/__bluewolf_login')){if(req.method==='POST'){const chunks=[];for await(const c of req)chunks.push(c);const form=new URLSearchParams(Buffer.concat(chunks).toString());if(form.get('password')===password){res.writeHead(303,{location:'/','set-cookie':`${cookieName}=${token}; Path=/; HttpOnly; Secure; SameSite=Lax`});res.end();return}res.writeHead(401,{'content-type':'text/html; charset=utf-8'});res.end(login(true));return}res.writeHead(200,{'content-type':'text/html; charset=utf-8'});res.end(login(false));return}if(!authed(req)){res.writeHead(303,{location:'/__bluewolf_login'});res.end();return}proxy(req,res)}).listen(3001,'127.0.0.1');
          EOF
          nohup env PASSWORD="$PASSWORD" TOKEN="$TOKEN" node /tmp/proxy.mjs >/tmp/proxy.log 2>&1 &
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = 303

      - name: Start tunnel and verify CSS and JS
        shell: bash
        run: |
          curl -L --fail --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3001 >/tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 45); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ]
          PASSWORD="$(cat /tmp/password)"
          for i in $(seq 1 20); do
            CODE="$(curl -sS -c /tmp/cookies -d "password=$PASSWORD" -o /dev/null -w '%{http_code}' --max-time 15 "$URL/__bluewolf_login" || true)"
            [ "$CODE" = 303 ] && break
            sleep 3
          done
          test "$CODE" = 303
          curl -fsS -b /tmp/cookies --max-time 20 "$URL/" -o /tmp/page.html
          grep -q 'זאב כחול' /tmp/page.html
          CSS="$(grep -Eo 'href="[^"]+\.css[^"]*"' /tmp/page.html | head -1 | cut -d'"' -f2)"
          JS="$(grep -Eo 'src="[^"]+\.js[^"]*"' /tmp/page.html | head -1 | cut -d'"' -f2)"
          for ASSET in "$CSS" "$JS"; do case "$ASSET" in http*) AURL="$ASSET";; /*) AURL="$URL$ASSET";; *) AURL="$URL/$ASSET";; esac; test "$(curl -sS -b /tmp/cookies -o /tmp/asset -w '%{http_code}' --max-time 20 "$AURL")" = 200; test -s /tmp/asset; done
          printf 'URL=%s\nPASSWORD=%s\nVERSION=v0.7-apple-maps\nCSS=%s\nJS=%s\nASSET_CHECK=passed\n' "$URL" "$PASSWORD" "$CSS" "$JS" >/tmp/credentials.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bluewolf-v07-preview-credentials
          path: /tmp/credentials.txt
          retention-days: 1
          compression-level: 0

      - name: Keep preview alive
        run: sleep 5400
