name: Blue Wolf v0.8 polish

on:
  push:
    branches: [tmp-v08-repair-run-2]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v08-repair-run-2
          fetch-depth: 0
      - name: Apply final TypeScript and version polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/bluewolf/developer-view.tsx')
          text = p.read_text()
          old = '  THRESHOLD_DESCRIPTIONS,\n  createId,'
          new = '  THRESHOLD_DESCRIPTIONS,\n  canonicalTemplateKey,\n  createId,'
          if old not in text: raise SystemExit('developer import anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('components/bluewolf/dashboard-app.tsx')
          text = p.read_text()
          text = text.replace('<Badge variant="outline">v0.4 QA</Badge>', '<Badge variant="outline">v0.8 SRS</Badge>')
          text = text.replace('QA", detail: "בדיקות הליבה האחרונות עברו"', 'QA", detail: "בדיקות SRS/CI אחרונות"')
          p.write_text(text)
          PY
      - name: Commit polish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/bluewolf/developer-view.tsx components/bluewolf/dashboard-app.tsx
          git commit -m "Fix template canonicalization import and expose v0.8 status"
          git push origin HEAD:tmp-v08-repair-run-2
