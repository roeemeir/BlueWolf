name: Blue Wolf v0.8 route editor

on:
  push:
    branches: [tmp-v08-repair-run-2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v08-repair-run-2
          fetch-depth: 0
      - name: Add draggable control-point route shaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('components/bluewolf/visuals.tsx')
          text = p.read_text()
          start = text.index('export function RouteBankMap(')
          new_tail = r'''function smoothClosedPath(points: Point[]) {
  if (points.length < 3) return closedPath(points);
  const midpoint = (a: Point, b: Point) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const first = midpoint(points[points.length - 1], points[0]);
  let d = `M${first.x.toFixed(2)},${first.y.toFixed(2)}`;
  points.forEach((point, index) => {
    const next = points[(index + 1) % points.length];
    const mid = midpoint(point, next);
    d += ` Q${point.x.toFixed(2)},${point.y.toFixed(2)} ${mid.x.toFixed(2)},${mid.y.toFixed(2)}`;
  });
  return `${d} Z`;
}

function defaultRouteControlPoints(route: SavedRoute): Point[] {
  if (route.family === "SI") {
    return Array.from({ length: 8 }, (_, index) => { const a = index / 8 * Math.PI * 2; return { x: Math.cos(a) * 45, y: Math.sin(a) * 45 }; });
  }
  if (route.routeKind === "double") {
    // Authoritative continuous articulated dog-bone: one loop, one centre waist.
    return [
      { x: -100, y: 0 }, { x: -86, y: -42 }, { x: -48, y: -58 }, { x: -18, y: -30 },
      { x: 0, y: -9 }, { x: 20, y: -31 }, { x: 52, y: -57 }, { x: 88, y: -40 },
      { x: 101, y: 1 }, { x: 86, y: 43 }, { x: 50, y: 58 }, { x: 19, y: 31 },
      { x: 0, y: 10 }, { x: -20, y: 32 }, { x: -51, y: 59 }, { x: -87, y: 42 },
    ];
  }
  if (route.routeKind === "figure8" || route.routeKind === "double-figure8") {
    return [
      { x: 0, y: 0 }, { x: 38, y: -37 }, { x: 76, y: -31 }, { x: 90, y: 0 },
      { x: 75, y: 32 }, { x: 38, y: 38 }, { x: 0, y: 0 }, { x: -38, y: -38 },
      { x: -75, y: -32 }, { x: -90, y: 0 }, { x: -76, y: 31 }, { x: -38, y: 37 },
    ];
  }
  return [
    { x: -58, y: -24 }, { x: 0, y: -24 }, { x: 58, y: -24 }, { x: 82, y: 0 },
    { x: 58, y: 24 }, { x: 0, y: 24 }, { x: -58, y: 24 }, { x: -82, y: 0 },
  ];
}

export function RouteBankMap({ routes, vehicleTypes, selectedId, onSelect, onMove, onControlPoints }: { routes: SavedRoute[]; vehicleTypes: VehicleType[]; selectedId: string | null; onSelect: (id: string) => void; onMove: (id: string, x: number, y: number) => void; onControlPoints: (id: string, points: Point[]) => void }) {
  const svgRef = useRef<SVGSVGElement>(null);
  const [dragId, setDragId] = useState<string | null>(null);
  const [dragPoint, setDragPoint] = useState<{ routeId: string; index: number } | null>(null);
  const pointerSvg = (event: React.PointerEvent<SVGSVGElement>) => {
    const rect = svgRef.current?.getBoundingClientRect();
    if (!rect) return { x: 450, y: 230 };
    return { x: clamp((event.clientX - rect.left) / rect.width * 900, 0, 900), y: clamp((event.clientY - rect.top) / rect.height * 460, 0, 460) };
  };
  const pointerPercent = (event: React.PointerEvent<SVGSVGElement>) => { const p = pointerSvg(event); return { x: clamp(p.x / 9, 5, 95), y: clamp(p.y / 4.6, 8, 92) }; };
  const localPoint = (event: React.PointerEvent<SVGSVGElement>, route: SavedRoute) => {
    const p = pointerSvg(event);
    const cx = (route.mapX ?? 50) / 100 * 900;
    const cy = (route.mapY ?? 50) / 100 * 460;
    const rad = -(route.rotationDeg ?? 0) * Math.PI / 180;
    const dx = p.x - cx; const dy = p.y - cy;
    const scale = Math.max(0.2, (route.scalePct ?? 100) / 100);
    return { x: (dx * Math.cos(rad) - dy * Math.sin(rad)) / scale, y: (dx * Math.sin(rad) + dy * Math.cos(rad)) / scale };
  };
  return <svg ref={svgRef} className="v04-route-bank-map" viewBox="0 0 900 460" onPointerMove={(event) => {
    if (dragPoint) {
      const route = routes.find((item) => item.id === dragPoint.routeId);
      if (!route) return;
      const points = route.controlPoints?.length && route.controlPoints.length >= 4 ? route.controlPoints : defaultRouteControlPoints(route);
      const next = points.map((point, index) => index === dragPoint.index ? localPoint(event, route) : point);
      onControlPoints(route.id, next);
      return;
    }
    if (!dragId) return;
    const p = pointerPercent(event);
    onMove(dragId, p.x, p.y);
  }} onPointerUp={() => { setDragId(null); setDragPoint(null); }} onPointerLeave={() => { setDragId(null); setDragPoint(null); }}>
    <defs><pattern id="route-bank-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" /></pattern></defs><rect width="900" height="460" /><rect width="900" height="460" fill="url(#route-bank-grid)" /><g className="v08-engineering-map" fill="none"><path d="M20 392 C180 310 300 420 450 322 S690 215 880 270" /><path d="M65 78 C220 125 355 110 510 62 S730 48 840 92" /></g>
    {routes.map((route) => {
      const type = vehicleTypes.find((item) => item.name === route.vehicleType);
      const x = (route.mapX ?? 50) / 100 * 900;
      const y = (route.mapY ?? 50) / 100 * 460;
      const color = type?.color ?? "#8396a4";
      const rotation = route.rotationDeg ?? 0;
      const scale = Math.max(0.2, (route.scalePct ?? 100) / 100);
      const controlPoints = route.controlPoints?.length && route.controlPoints.length >= 4 ? route.controlPoints : defaultRouteControlPoints(route);
      return <g key={route.id} className={`v04-bank-route ${selectedId === route.id ? "selected" : ""}`} transform={`translate(${x} ${y}) rotate(${rotation})`} onPointerDown={(event) => { event.currentTarget.setPointerCapture(event.pointerId); setDragId(route.id); onSelect(route.id); }} onClick={() => onSelect(route.id)}>
        <g transform={`scale(${scale})`}><path d={smoothClosedPath(controlPoints)} stroke={color} className={route.routeKind === "double" ? "v08-continuous-double" : ""} />{selectedId === route.id && controlPoints.map((point, index) => <circle key={index} className="v08-control-point" cx={point.x} cy={point.y} r={5.5 / scale} stroke={color} onPointerDown={(event) => { event.stopPropagation(); event.currentTarget.setPointerCapture(event.pointerId); setDragId(null); setDragPoint({ routeId: route.id, index }); }}><title>נקודת עריכה {index + 1}</title></circle>)}</g>
        <g transform={`rotate(${-rotation}) translate(0 ${72 * scale})`}><rect x="-66" y="-14" width="132" height="28" rx="14" /><text y="5" textAnchor="middle">{route.name}</text></g>
      </g>;
    })}
  </svg>;
}
'''
          p.write_text(text[:start] + new_tail)

          p = Path('components/bluewolf/developer-view.tsx')
          text = p.read_text()
          old = 'onMove={(id, x, y) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, mapX: x, mapY: y } : route))} />'
          new = 'onMove={(id, x, y) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, mapX: x, mapY: y } : route))} onControlPoints={(id, points) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, controlPoints: points, updatedAt: new Date().toISOString() } : route))} />'
          if old not in text: raise SystemExit('RouteBankMap caller anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('גרור את הנתיב עצמו על המפה כדי להזיז אותו.', 'גרור את הנתיב כדי להזיז אותו; כשהוא מסומן, גרור כל נקודת עריכה כדי להזיז, להרחיב ולשנות את צורת המסלול.')
          p.write_text(text)

          p = Path('app/v08.css')
          text = p.read_text() + r'''

.v08-control-point {
  fill: var(--card);
  stroke-width: 2.2;
  vector-effect: non-scaling-stroke;
  cursor: grab;
  touch-action: none;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.16));
}
.v08-control-point:active { cursor: grabbing; }
.v04-bank-route.selected > g:first-of-type > path { stroke-width: 4.5; }
'''
          p.write_text(text)
          PY
      - name: Commit route editor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/bluewolf/visuals.tsx components/bluewolf/developer-view.tsx app/v08.css
          git commit -m "Add draggable route control-point editing"
          git push origin HEAD:tmp-v08-repair-run-2
