name: Blue Wolf Algorithm Core

on:
  push:
    paths:
      - "packages/bluewolf-core/**"
  pull_request:
    paths:
      - "packages/bluewolf-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-contract:
    name: Algorithm core contract + tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Independent core typecheck + executable tests
        run: npm run core:test
      - name: Verify core boundary stays pure
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'packages/bluewolf-core/src';
          const forbidden = [
            /from\s+["'](?:react|next|drizzle-orm|@\/)/,
            /\b(?:window|document|localStorage)\b/,
            /\bfetch\s*\(/,
          ];
          const files = fs.readdirSync(root).filter((name) => name.endsWith('.ts'));
          const violations = [];
          for (const file of files) {
            const source = fs.readFileSync(path.join(root, file), 'utf8');
            for (const rule of forbidden) if (rule.test(source)) violations.push(`${file}: ${rule}`);
          }
          if (violations.length) {
            console.error('Algorithm core crossed the application/runtime boundary:');
            console.error(violations.join('\n'));
            process.exit(1);
          }
          console.log(`Core boundary clean across ${files.length} source files.`);
          NODE
      - name: Core contract summary
        run: |
          echo "Core API: $(grep -Eo 'CORE_API_VERSION = \"[^\"]+' packages/bluewolf-core/src/contracts.ts | head -1)"
          echo "No UI build, browser QA or DB migration is required for a core-only development gate."
