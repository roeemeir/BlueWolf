name: Blue Wolf Algorithm Core

on:
  push:
    paths:
      - "core/**"
      - "docs/BLUE_WOLF_ARCHITECTURE_DECISIONS_2026-09-06_V1_7.md"
      - "docs/BLUE_WOLF_ARCHITECTURE_V1_7_SIMPLIFIED_CANONICAL.md"
  pull_request:
    paths:
      - "core/**"
      - "docs/BLUE_WOLF_ARCHITECTURE_DECISIONS_2026-09-06_V1_7.md"
      - "docs/BLUE_WOLF_ARCHITECTURE_V1_7_SIMPLIFIED_CANONICAL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core-contract:
    name: Canonical Python Core contract + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent Core regression suite
        working-directory: core
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify canonical Core boundary stays pure
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path("core/src/bluewolf_core")
          forbidden_modules = {
              "sqlite3", "sqlalchemy", "drizzle", "requests", "httpx",
              "aiohttp", "socket", "react", "next",
          }
          forbidden_names = {"window", "document", "localStorage"}
          violations = []

          for path in sorted(root.glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root_name = alias.name.split(".")[0]
                          if root_name in forbidden_modules:
                              violations.append(f"{path}: forbidden import {alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      root_name = (node.module or "").split(".")[0]
                      if root_name in forbidden_modules:
                          violations.append(f"{path}: forbidden import {node.module}")
                  elif isinstance(node, ast.Name) and node.id in forbidden_names:
                      violations.append(f"{path}: forbidden global {node.id}")

          if violations:
              raise SystemExit("Core boundary violation:\n" + "\n".join(sorted(set(violations))))
          print(f"Canonical Python Core boundary clean across {len(list(root.glob('*.py')))} files.")
          PY
      - name: Core contract summary
        working-directory: core
        run: |
          PYTHONPATH=src python - <<'PY'
          import bluewolf_core
          from bluewolf_core import CoreConfig
          config = CoreConfig()
          print("Core API:", bluewolf_core.CORE_API_VERSION)
          print("Implementation:", bluewolf_core.IMPLEMENTATION_LANGUAGE, bluewolf_core.__version__)
          print("logical_grid_seconds:", config.timing.logical_grid_seconds)
          print("live_batch_seconds:", config.timing.live_batch_seconds)
          print("checkpoint_seconds:", config.timing.checkpoint_seconds)
          print("membership_confirmation_seconds:", config.grouping.membership_confirmation_seconds)
          PY