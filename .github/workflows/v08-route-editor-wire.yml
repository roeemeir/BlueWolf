name: Blue Wolf v0.8 route editor wiring

on:
  push:
    branches: [tmp-v08-repair-run-2]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v08-repair-run-2
          fetch-depth: 0
      - name: Wire route editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/bluewolf/developer-view.tsx')
          text = p.read_text()
          old_import = 'import { GtPlayback, RouteBankMap, TemplatePreview, VehicleIconGlyph } from "./visuals";'
          new_import = 'import { GtPlayback, TemplatePreview, VehicleIconGlyph } from "./visuals";\nimport { RouteBankEditorV08 } from "./route-bank-editor-v08";'
          if old_import not in text:
              raise SystemExit('route bank import anchor missing')
          text = text.replace(old_import, new_import, 1)
          old_call = '<RouteBankMap routes={filtered} vehicleTypes={state.vehicleTypes} selectedId={selectedId} onSelect={setSelectedId} onMove={(id, x, y) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, mapX: x, mapY: y } : route))} />'
          new_call = '<RouteBankEditorV08 routes={filtered} vehicleTypes={state.vehicleTypes} selectedId={selectedId} mapLabel={state.mapServers.find((item) => item.enabled)?.name ?? "מפת הנדסה"} onSelect={setSelectedId} onMove={(id, x, y) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, mapX: x, mapY: y, updatedAt: new Date().toISOString() } : route))} onControlPoints={(id, controlPoints) => setDraftRoutes(draftRoutes.map((route) => route.id === id ? { ...route, controlPoints, updatedAt: new Date().toISOString() } : route))} />'
          if old_call not in text:
              raise SystemExit('route bank caller anchor missing')
          text = text.replace(old_call, new_call, 1)
          old_hint = 'גרור את Route על המפה. עריכת control-points חופשית תישמר במודל הגיאומטריה בגרסת ה־integration, ולא מסומנת כאן כ־PASS.'
          new_hint = 'גרור את Route כדי להזיז אותו. כשהוא מסומן, גרור את נקודות הבקרה כדי להזיז, להרחיב ולשנות את צורת המסלול; הנקודות נשמרות ב־Route עצמו.'
          if old_hint not in text:
              raise SystemExit('route editor hint anchor missing')
          p.write_text(text.replace(old_hint, new_hint, 1))

          css = Path('app/v08.css')
          css.write_text(css.read_text() + '''\n\n.v08-route-bank-editor{touch-action:none;user-select:none}.v08-route-map-bg{fill:color-mix(in srgb,var(--background) 95%,#d6e7eb 5%)}.v08-route-map-grid path{stroke:color-mix(in srgb,var(--foreground) 7%,transparent);fill:none}.v08-route-map-context path{stroke:color-mix(in srgb,var(--foreground) 14%,transparent);stroke-width:2}.v08-route-map-context path:nth-child(-n+3){stroke-width:4}.v08-route-map-label rect,.v08-route-name rect{fill:color-mix(in srgb,var(--card) 90%,transparent);stroke:var(--v08-border)}.v08-route-map-label text,.v08-route-name text{fill:var(--foreground);font-size:12px;font-weight:800}.v08-editable-route{cursor:grab;touch-action:none}.v08-editable-route:active{cursor:grabbing}.v08-editable-route path{fill:none;stroke-width:3.5;vector-effect:non-scaling-stroke}.v08-editable-route.selected path{stroke-width:5}.v08-control-point{fill:var(--card);stroke-width:2.4;vector-effect:non-scaling-stroke;cursor:grab;touch-action:none}.v08-control-point:active{cursor:grabbing}.v08-continuous-double{stroke-linejoin:round}\n''')
          PY
      - name: Commit route editor wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/bluewolf/developer-view.tsx app/v08.css
          git commit -m "Wire draggable control-point route editor into developer bank"
          git push origin HEAD:tmp-v08-repair-run-2
