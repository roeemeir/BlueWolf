name: Blue Wolf WKT Browser E2E

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-wkt-e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  wkt-browser-e2e:
    name: BW-QA-003 — WKT browser save/drag/restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BLUEWOLF_STORAGE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build:offline
      - name: Install Chromium regression runner
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Verify WKT UI edit, drag, save, refresh and process restart
        run: python scripts/verify_wkt_browser_e2e.py
