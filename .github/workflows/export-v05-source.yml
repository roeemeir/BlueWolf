name: Export Blue Wolf v0.5 source

on:
  push:
    branches:
      - local-preview-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified v0.5 overlay
        shell: bash
        run: |
          cat .preview/v05.part* | base64 -d > /tmp/bluewolf-v05-overlay.tar.gz
          echo "7c6cea729ae5a4159e7386e19da4efd00555f12b08999017e5743e76f36ab567  /tmp/bluewolf-v05-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bluewolf-v05-overlay.tar.gz -C .
          test -f app/v05.css
          grep -q 'motionFrame' components/bluewolf/visuals.tsx
      - name: Pack source
        shell: bash
        run: |
          tar -czf /tmp/bluewolf-v05-source.tar.gz \
            app components lib tests package.json package-lock.json tsconfig.json vite.config.ts eslint.config.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bluewolf-v05-source
          path: /tmp/bluewolf-v05-source.tar.gz
          retention-days: 1
          compression-level: 0
