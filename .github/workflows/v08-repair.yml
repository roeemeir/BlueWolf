name: Blue Wolf v0.8 repair

on:
  push:
    branches: [tmp-v08-repair-run-2]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v08-repair-run-2
          fetch-depth: 0
      - name: Apply deterministic source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Public API must expose RouteTopology for production topology tests.
          replace(
              'core/src/bluewolf_core/__init__.py',
              '    RouteFamily,\n    RouteSubtype,\n    StateChange,',
              '    RouteFamily,\n    RouteSubtype,\n    RouteTopology,\n    StateChange,'
          )
          replace(
              'core/src/bluewolf_core/__init__.py',
              '    "RouteShape",\n    "RouteSubtype",',
              '    "RouteShape",\n    "RouteSubtype",\n    "RouteTopology",'
          )

          # SI orientation is physically meaningless for circular/compact routes;
          # ignoring PCA orientation prevents false 20% revision resets.
          replace(
              'core/src/bluewolf_core/session.py',
              '    geometry = max(\n        _center_distance_m(first, second) / scale,\n        _relative_error(first.long_axis_a_m, second.long_axis_a_m),\n        _relative_error(first.short_axis_b_m, second.short_axis_b_m),\n        _orientation_error_ratio(first.orientation_deg, second.orientation_deg),\n    )',
              '    orientation_change = (\n        0.0\n        if first.family is RouteFamily.SI\n        else _orientation_error_ratio(first.orientation_deg, second.orientation_deg)\n    )\n    geometry = max(\n        _center_distance_m(first, second) / scale,\n        _relative_error(first.long_axis_a_m, second.long_axis_a_m),\n        _relative_error(first.short_axis_b_m, second.short_axis_b_m),\n        orientation_change,\n    )'
          )

          p = Path('core/src/bluewolf_core/session.py')
          text = p.read_text()
          start = text.index('    def _update_initial_route(')
          end = text.index('    def _update_confirmed_route(', start)
          new_block = '''    def _update_initial_route(self, sample: VehicleSample, route_state: _RouteRuntimeState) -> list[StateChange]:\n        changes: list[StateChange] = []\n        candidate_config = replace(\n            self.config.detection,\n            new_route_observation_seconds=self.config.detection.known_route_candidate_seconds,\n        )\n        candidate_detection = detect_closed_route(route_state.history, candidate_config)\n        if candidate_detection is not None and route_state.candidate is None:\n            route_state.candidate = candidate_detection.effective\n            route_state.candidate_since_utc = sample.sample_time_utc\n            changes.append(\n                self._route_change(\n                    sample,\n                    ChangeKind.ROUTE_CANDIDATE,\n                    candidate_detection,\n                    revision=route_state.revision,\n                )\n            )\n\n        confirmed_detection = detect_closed_route(route_state.history, self.config.detection)\n        if confirmed_detection is None:\n            return changes\n\n        confirmed = confirmed_detection.effective\n        route_state.candidate = confirmed\n        route_state.confirmed = replace(confirmed, route_id=f"{confirmed.route_id}:r0")\n        route_state.pending_revision = None\n        route_state.pending_since_utc = None\n        changes.append(\n            self._route_change(\n                sample,\n                ChangeKind.ROUTE_CONFIRMED,\n                confirmed_detection,\n                route_override=route_state.confirmed,\n                revision=0,\n            )\n        )\n        return changes\n\n'''
          p.write_text(text[:start] + new_block + text[end:])

          # Operator: remove render-time Date.now impurity; timeouts own mute expiry.
          replace(
              'components/bluewolf/operator-view.tsx',
              '  const mapRef = useRef<HTMLDivElement>(null);\n  const influxConfigured',
              '  const mapRef = useRef<HTMLDivElement>(null);\n  const muteTimerRef = useRef<number | null>(null);\n  const influxConfigured'
          )
          replace(
              'components/bluewolf/operator-view.tsx',
              '  const activeTemplate = state.templates.find((item) => item.id === activeTemplateId) ?? state.templates.find((item) => item.family === selected.family);\n',
              ''
          )
          replace(
              'components/bluewolf/operator-view.tsx',
              '  const muted = mutedUntil === Number.POSITIVE_INFINITY || mutedUntil > Date.now();',
              '  const muted = mutedUntil !== 0;'
          )
          replace(
              'components/bluewolf/operator-view.tsx',
              '''  const muteFor = (value: "restart" | "5" | "15" | "30" | "off") => {\n    if (value === "off") setMutedUntil(0);\n    else if (value === "restart") setMutedUntil(Number.POSITIVE_INFINITY);\n    else setMutedUntil(Date.now() + Number(value) * 60_000);\n    toast.success(value === "off" ? "הצליל הופעל" : `ההתראות הקוליות הושתקו ${value === "restart" ? "עד הפעלה מחדש" : `ל־${value} דקות`}`);\n  };''',
              '''  const muteFor = (value: "restart" | "5" | "15" | "30" | "off") => {\n    if (muteTimerRef.current !== null) { window.clearTimeout(muteTimerRef.current); muteTimerRef.current = null; }\n    if (value === "off") setMutedUntil(0);\n    else if (value === "restart") setMutedUntil(Number.POSITIVE_INFINITY);\n    else {\n      const minutes = Number(value);\n      setMutedUntil(minutes);\n      muteTimerRef.current = window.setTimeout(() => { setMutedUntil(0); muteTimerRef.current = null; }, minutes * 60_000);\n    }\n    toast.success(value === "off" ? "הצליל הופעל" : `ההתראות הקוליות הושתקו ${value === "restart" ? "עד הפעלה מחדש" : `ל־${value} דקות`}`);\n  };'''
          )

          # GT participant selection: reset in explicit user handlers, not a synchronous effect.
          replace(
              'components/bluewolf/developer-view.tsx',
              '  useEffect(() => { setParticipants(group.members.map((member) => member.id)); }, [group.id]);\n',
              ''
          )
          replace(
              'components/bluewolf/developer-view.tsx',
              '<Select value={serverId} onValueChange={setServerId}>',
              '<Select value={serverId} onValueChange={(value) => { setServerId(value); const next = getServerScenario(value).groups[family.toLowerCase() as "si" | "so"]; setParticipants(next.members.map((member) => member.id)); }}>'
          )
          replace(
              'components/bluewolf/developer-view.tsx',
              '<Select value={family} onValueChange={(value) => setFamily(value as Family)}>',
              '<Select value={family} onValueChange={(value) => { const nextFamily = value as Family; setFamily(nextFamily); const next = getServerScenario(serverId).groups[nextFamily.toLowerCase() as "si" | "so"]; setParticipants(next.members.map((member) => member.id)); }}>'
          )
          PY
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/bluewolf_core/__init__.py core/src/bluewolf_core/session.py components/bluewolf/operator-view.tsx components/bluewolf/developer-view.tsx
          git commit -m "Repair v0.8 lifecycle and React purity regressions"
          git push origin HEAD:tmp-v08-repair-run-2
