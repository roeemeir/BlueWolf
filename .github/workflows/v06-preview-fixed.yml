name: Blue Wolf v0.6 Fixed Preview

on:
  push:
    branches: [local-preview-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.5 + feedback + regression fix
        shell: bash
        run: |
          cat .preview/v05.part* | base64 -d > /tmp/v05.tar.gz
          echo "7c6cea729ae5a4159e7386e19da4efd00555f12b08999017e5743e76f36ab567  /tmp/v05.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v05.tar.gz -C .
          cat .preview/v06.part* | base64 -d > /tmp/v06.tar.gz
          echo "53ef104cdc876e4bc3e8cd7e4111e509884abe9048bab927b87d24efe5d05450  /tmp/v06.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v06.tar.gz -C .
          cat .preview/v07.part* | base64 -d > /tmp/v07.tar.gz
          echo "77e6eb56bf50ce34bcb5e02c1c161139d877b8a14a865cb4ede5592527d03bcd  /tmp/v07.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v07.tar.gz -C .
          grep -q 'v06-score-trails' components/bluewolf/visuals.tsx
          grep -q 'allSiPairs' components/bluewolf/visuals.tsx
          grep -q 'mixedAllowed' components/bluewolf/developer-view.tsx
          grep -q 'exportPdfReport' components/bluewolf/investigation-view.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Prepare local D1
        working-directory: dist/server
        run: |
          node ../../node_modules/wrangler/bin/wrangler.js d1 execute site-creator-d1 --local --config wrangler.json --file ../.openai/drizzle/0000_luxuriant_tarantula.sql

      - name: Start app
        working-directory: dist/server
        run: |
          nohup node ../../node_modules/wrangler/bin/wrangler.js dev --config wrangler.json --port 3000 >/tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/app.log; exit 1

      - name: Start password gate
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 10)"; TOKEN="$(openssl rand -hex 24)"
          printf '%s' "$PASSWORD" >/tmp/password
          cat >/tmp/proxy.mjs <<'EOF'
          import http from 'node:http';
          import {URLSearchParams} from 'node:url';
          const password=process.env.PASSWORD, token=process.env.TOKEN, cookie='bw_preview';
          const ok=req=>(req.headers.cookie??'').split(';').some(x=>x.trim()===`${cookie}=${token}`);
          const page=bad=>`<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blue Wolf</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:system-ui,-apple-system}.c{width:min(84vw,350px);padding:24px;border-radius:24px;background:#102036dd;border:1px solid #ffffff25;backdrop-filter:blur(24px);box-shadow:0 24px 70px #0008}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:10px;border-radius:13px;font:inherit}input{color:#fff;background:#081525;border:1px solid #426080}button{border:0;background:#3b82f6;color:#fff;font-weight:800}.bad{color:#fb7185}</style></head><body><form class="c" method="post" action="/__bluewolf_login"><h1>זאב כחול</h1><p>גרסת בדיקה מעודכנת</p>${bad?'<p class="bad">סיסמה שגויה</p>':''}<input name="password" type="password" placeholder="סיסמה" autofocus><button>כניסה</button></form></body></html>`;
          function proxy(req,res){const h={...req.headers,host:'127.0.0.1:3000','x-forwarded-proto':'https'};delete h.connection;delete h.authorization;const u=http.request({hostname:'127.0.0.1',port:3000,path:req.url,method:req.method,headers:h},r=>{const rh={...r.headers};delete rh.connection;res.writeHead(r.statusCode??502,rh);r.pipe(res)});u.on('error',e=>{res.writeHead(502);res.end(e.message)});req.pipe(u)}
          http.createServer(async(req,res)=>{if(req.url?.startsWith('/__bluewolf_login')){if(req.method==='POST'){const chunks=[];for await(const c of req)chunks.push(c);const f=new URLSearchParams(Buffer.concat(chunks).toString());if(f.get('password')===password){res.writeHead(303,{location:'/','set-cookie':`${cookie}=${token}; Path=/; HttpOnly; Secure; SameSite=Lax`});res.end();return}res.writeHead(401,{'content-type':'text/html; charset=utf-8'});res.end(page(true));return}res.writeHead(200,{'content-type':'text/html; charset=utf-8'});res.end(page(false));return}if(!ok(req)){res.writeHead(303,{location:'/__bluewolf_login'});res.end();return}proxy(req,res)}).listen(3001,'127.0.0.1');
          EOF
          nohup env PASSWORD="$PASSWORD" TOKEN="$TOKEN" node /tmp/proxy.mjs >/tmp/proxy.log 2>&1 &
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/)" = 303

      - name: Start tunnel and verify
        shell: bash
        run: |
          curl -L --fail --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3001 >/tmp/tunnel.log 2>&1 &
          URL=""; for i in $(seq 1 45); do URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)"; [ -n "$URL" ] && break; sleep 2; done
          [ -n "$URL" ]
          PASSWORD="$(cat /tmp/password)"
          CODE=""; for i in $(seq 1 20); do CODE="$(curl -sS -c /tmp/cookies -d "password=$PASSWORD" -o /dev/null -w '%{http_code}' --max-time 15 "$URL/__bluewolf_login" || true)"; [ "$CODE" = 303 ] && break; sleep 3; done
          test "$CODE" = 303
          curl -fsS -b /tmp/cookies --max-time 20 "$URL/" -o /tmp/page.html
          grep -q 'זאב כחול' /tmp/page.html
          ASSET="$(grep -Eo '(src|href)="[^"]+\.(css|js)[^"]*"' /tmp/page.html | head -1 | sed -E 's/^(src|href)="([^"]+)"$/\2/')"
          case "$ASSET" in http*) AURL="$ASSET";; /*) AURL="$URL$ASSET";; *) AURL="$URL/$ASSET";; esac
          test "$(curl -sS -b /tmp/cookies -o /tmp/asset -w '%{http_code}' --max-time 20 "$AURL")" = 200
          printf 'URL=%s\nPASSWORD=%s\nVERSION=v0.6-full-feedback-fixed\nASSET_CHECK=passed:%s\n' "$URL" "$PASSWORD" "$ASSET" >/tmp/credentials.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bluewolf-v06-fixed-preview-credentials
          path: /tmp/credentials.txt
          retention-days: 1
          compression-level: 0

      - name: Keep preview alive
        run: sleep 5400
