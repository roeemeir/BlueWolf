name: Blue Wolf Navigation Input Integration

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-navigation-input-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  navigation-source:
    name: Navigation-only SIM → real join → Python Core → isolated SQLite → HTTP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the actual Blue Wolf core and runtime adapters
        working-directory: core
        run: python -m pip install -e '.[service,influx]'
      - name: Verify source isolation, SI scores and event HTTP bridge, three-server SQLite checkpoint restart
        working-directory: core/tests
        run: python -m unittest -v test_navigation_simulation test_navigation_simulation_pipeline test_simulation_storage_guard test_navigation_route_confirmation test_navigation_runtime_publication test_navigation_http_history test_core_display_score test_navigation_core_scored_si test_navigation_core_si_checkpoint_e2e
