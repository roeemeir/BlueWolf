name: Blue Wolf REP-03 REP-04 Lifecycle

on:
  push:
  pull_request:

concurrency:
  group: bluewolf-rep03-rep04-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: REP-03/04 — event lifecycle truth path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python core
        working-directory: core
        run: python -m pip install -e .
      - name: Verify lifecycle archive and runtime transitions
        working-directory: core/tests
        run: python -m unittest -v test_event_lifecycle_archive test_event_alert test_event_observation_sink test_investigation_service
